name: Build AutoHotspot APK

on:
  push:
    branches:
      - claude/auto-hotspot-android-nYqTc
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show SDK environment
        run: |
          echo "=== SDK paths ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== Installed build-tools ==="
          ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "NONE"
          echo "=== Installed platforms ==="
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "NONE"
          echo "=== cmdline-tools ==="
          ls $ANDROID_SDK_ROOT/cmdline-tools/ 2>/dev/null || echo "NONE"

      - name: Accept SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -5 || true

      - name: Install required SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x auto-hotspot-android/gradlew

      - name: Build debug APK
        run: |
          cd auto-hotspot-android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotspot-debug
          path: auto-hotspot-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
