name: Build AutoHotspot APK

on:
  push:
    branches:
      - claude/auto-hotspot-android-nYqTc
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses and install components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x auto-hotspot-android/gradlew

      - name: Build debug APK
        run: |
          cd auto-hotspot-android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotspot-debug
          path: auto-hotspot-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
