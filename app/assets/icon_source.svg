<?xml version="1.0" encoding="UTF-8"?>
<!--
  Zeiterfassung – App Icon Source
  1024×1024 px master file.
  Use this to generate:
    • Android: flutter_launcher_icons or manual PNG export per mipmap density
    • Windows:  convert to .ico (256/48/32/16 px) via e.g. https://convertico.com
    • Tray:    export 32×32 and convert to .ico  →  assets/tray_icon.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>

    <!-- Outer ring: dark charcoal, lit from top-left -->
    <radialGradient id="ringGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#848484"/>
      <stop offset="100%" stop-color="#181818"/>
    </radialGradient>

    <!-- Watch face: warm light-grey, glassy radial gradient -->
    <radialGradient id="faceGrad" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#e4e4e4"/>
      <stop offset="45%"  stop-color="#b6b6b6"/>
      <stop offset="100%" stop-color="#686868"/>
    </radialGradient>

    <!-- Glass shine: semi-transparent white, top-left quadrant -->
    <radialGradient id="shineGrad" cx="38%" cy="28%" r="62%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="65%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Crown / buttons: dark metal gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#888888"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>

    <!-- Drop shadow for the whole watch body -->
    <filter id="bodyShadow" x="-8%" y="-6%" width="120%" height="122%">
      <feDropShadow dx="0" dy="14" stdDeviation="22"
                    flood-color="#000000" flood-opacity="0.50"/>
    </filter>

    <!-- Clip glass shine to face circle -->
    <clipPath id="faceClip">
      <circle cx="512" cy="540" r="352"/>
    </clipPath>

  </defs>

  <!-- ── Crown (top button) ─────────────────────────────────────────── -->
  <rect x="487" y="64" width="50" height="100" rx="20"
        fill="url(#metalGrad)"/>
  <!-- Crown gloss -->
  <rect x="494" y="70" width="18" height="44" rx="8"
        fill="white" opacity="0.18"/>

  <!-- ── Side pusher (right) ───────────────────────────────────────── -->
  <rect x="934" y="488" width="46" height="90" rx="18"
        fill="url(#metalGrad)"/>

  <!-- ── Outer ring (with drop shadow) ────────────────────────────── -->
  <circle cx="512" cy="540" r="426"
          fill="url(#ringGrad)" filter="url(#bodyShadow)"/>

  <!-- Thin bezel highlight (white arc top edge) -->
  <circle cx="512" cy="540" r="424"
          fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="4"/>

  <!-- ── Watch face ────────────────────────────────────────────────── -->
  <circle cx="512" cy="540" r="352" fill="url(#faceGrad)"/>

  <!-- ── Tick marks (12 × 30°) ────────────────────────────────────── -->
  <!-- Major ticks at 0°/90°/180°/270° (12, 3, 6, 9 o'clock) -->
  <g transform="rotate(  0 512 540)"><rect x="506" y="191" width="12" height="54" rx="6" fill="#333"/></g>
  <g transform="rotate( 90 512 540)"><rect x="506" y="191" width="12" height="54" rx="6" fill="#333"/></g>
  <g transform="rotate(180 512 540)"><rect x="506" y="191" width="12" height="54" rx="6" fill="#333"/></g>
  <g transform="rotate(270 512 540)"><rect x="506" y="191" width="12" height="54" rx="6" fill="#333"/></g>
  <!-- Minor ticks -->
  <g transform="rotate( 30 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate( 60 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate(120 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate(150 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate(210 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate(240 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate(300 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>
  <g transform="rotate(330 512 540)"><rect x="507" y="200" width="10" height="36" rx="5" fill="#7a7a7a"/></g>

  <!-- ── Second hand (~10 s = 60° from 12) ─────────────────────────── -->
  <!--  sin(60°)=0.866, cos(60°)=0.5
        Tip:  512 + 0.866×320 = 789,  540 − 0.5×320 = 380
        Tail: 512 − 0.866×92  = 432,  540 + 0.5×92  = 586  -->
  <line x1="432" y1="586" x2="789" y2="380"
        stroke="#282828" stroke-width="14" stroke-linecap="round"/>

  <!-- ── Center pivot ───────────────────────────────────────────────── -->
  <circle cx="512" cy="540" r="30" fill="#3a3a3a"/>
  <circle cx="512" cy="540" r="17" fill="#909090"/>
  <circle cx="512" cy="540" r="8"  fill="#242424"/>

  <!-- ── Glass shine overlay (clipped to face) ─────────────────────── -->
  <ellipse cx="388" cy="410" rx="265" ry="190"
           fill="url(#shineGrad)" clip-path="url(#faceClip)"/>

</svg>
