name: zeiterfassung
description: Arbeitszeiterfassung - Android & Windows

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  excel: ^4.0.6
  http: ^1.2.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  intl: ^0.20.0
  shared_preferences: ^2.2.3
  file_picker: ^8.1.2
  share_plus: ^12.0.2
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.2
  flutter_background_service: ^5.0.5
  ffi: ^2.1.3
  tray_manager: ^0.2.3
  window_manager: ^0.3.9
  package_info_plus: ^8.0.0
  # tray_manager + window_manager: nur auf Windows aktiv (Platform.isWindows-Guards im Code)
  # enough_mail: ^2.1.0  – Konflikt mit excel/archive; IMAP-Backend pending
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tray_icon.ico
